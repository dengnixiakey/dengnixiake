<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6c63ff">
<title>我的个人导航</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f7fb;--card:rgba(255,255,255,.78);--text:#20232a;--muted:#7b8190;--line:rgba(40,50,80,.10);--accent:#6c63ff;--accent2:#8b83ff;--danger:#e5484d;--shadow:0 12px 35px rgba(55,65,100,.09)}
body.dark{--bg:#101218;--card:rgba(27,30,40,.82);--text:#f5f6fa;--muted:#a6abba;--line:rgba(255,255,255,.09);--shadow:0 14px 40px rgba(0,0,0,.28)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 5%,rgba(108,99,255,.18),transparent 28%),radial-gradient(circle at 92% 12%,rgba(0,190,255,.12),transparent 27%),var(--bg);min-height:100vh;transition:.25s}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:min(1180px,92%);margin:auto;padding:26px 0 55px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:22px;box-shadow:0 9px 22px rgba(108,99,255,.25)}
.brand h1{font-size:20px}.brand p{font-size:12px;color:var(--muted);margin-top:3px}
.header-actions{display:flex;gap:8px}.icon-btn,.small-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;backdrop-filter:blur(16px)}
.hero{text-align:center;padding:48px 0 30px}.hero h2{font-size:34px}.hero p{color:var(--muted);margin-top:9px}.time{color:var(--accent);font-size:13px;margin-top:8px}
.search{max-width:720px;margin:0 auto 30px;position:relative}.search input{width:100%;height:58px;border:1px solid var(--line);outline:none;border-radius:18px;background:var(--card);color:var(--text);padding:0 55px;font-size:16px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.search span{position:absolute;left:20px;top:16px;font-size:22px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0 28px}.categories{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.cat-btn{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:11px;padding:8px 13px}.cat-btn.active{background:var(--accent);color:white;border-color:var(--accent)}
.primary{border:0;border-radius:12px;padding:10px 15px;background:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(108,99,255,.2)}
.section{margin:0 0 32px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-title{display:flex;align-items:center;gap:9px;font-size:18px}.section-actions{display:flex;gap:6px}.links{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:16px;min-height:78px;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);backdrop-filter:blur(18px);transition:.2s}.card:hover{transform:translateY(-4px);border-color:rgba(108,99,255,.35)}.fav{position:absolute;right:9px;top:7px;border:0;background:none;color:#c5c8d0;font-size:13px}.fav.on{color:#f2b01e}.site-icon{width:43px;height:43px;display:grid;place-items:center;flex:0 0 43px;border-radius:13px;background:rgba(108,99,255,.10);font-size:21px;overflow:hidden}.site-icon img{width:27px;height:27px;object-fit:contain}.name{font-weight:650;font-size:14px;margin-bottom:5px}.desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;padding:45px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:50px}
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.modal{width:min(500px,100%);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal h3{margin-bottom:18px}.form{display:grid;gap:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--card);color:var(--text);outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger{background:var(--danger);color:#fff;border:0;border-radius:10px;padding:9px 13px}
.manage-list{display:grid;gap:8px;max-height:330px;overflow:auto}.manage-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.manage-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.manage-item div{display:flex;gap:5px;flex-shrink:0}
@media(max-width:850px){.links{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.app{width:94%}.hero{padding-top:35px}.hero h2{font-size:27px}.links{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.header-actions .small-label{display:none}.header-actions button{padding:9px 10px}}

/* Category icon picker */
.icon-picker-wrap{display:flex;gap:10px;align-items:center}
.icon-preview{width:46px;height:46px;border:1px solid var(--border);border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--card)}
.icon-picker{margin-top:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:7px;max-height:190px;overflow:auto;padding:8px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
.icon-option{height:36px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;font-size:21px;display:grid;place-items:center}
.icon-option:hover,.icon-option.selected{background:var(--soft);border-color:var(--accent)}
.icon-custom-row{display:flex;gap:8px;margin-top:8px}
.icon-custom-row input{flex:1}
@media(max-width:600px){.icon-picker{grid-template-columns:repeat(7,1fr)}}


/* Drag & drop sorting */
.card{transition:transform .16s ease,box-shadow .16s ease,opacity .16s ease}
.card[draggable="true"]{cursor:grab}
.card.dragging{opacity:.45;transform:scale(.98)}
.card.drag-over{outline:2px dashed var(--accent);outline-offset:3px}
.drag-handle{
  width:28px;height:28px;border:0;background:transparent;color:var(--muted);
  cursor:grab;border-radius:8px;font-size:17px;display:grid;place-items:center;flex:0 0 auto
}
.drag-handle:hover{background:var(--soft);color:var(--text)}
.drag-handle:active{cursor:grabbing}
@media (hover:none){
  .card[draggable="true"]{cursor:default}
}


/* Long-term system upgrades */
.card.drag-over{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.10)}
.card .card-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.card .quick-action{
  width:28px;height:28px;border:0;background:transparent;color:var(--muted);
  border-radius:8px;cursor:pointer;font-size:14px
}
.card .quick-action:hover{background:var(--soft);color:var(--text)}
.site-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;
  padding:2px 6px;border-radius:999px;background:var(--soft);color:var(--muted);margin-top:5px
}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:18px}
.empty-state .big{font-size:34px;margin-bottom:8px}
.category-dragging{opacity:.45}
.cat-btn.drag-over{outline:2px dashed var(--accent);outline-offset:2px}
.top-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat-pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted);background:var(--card)}
.backup-reminder{font-size:11px;color:var(--muted);margin-left:auto}


/* Cleaner site card layout: content first, controls secondary */
.card{
  gap:14px;
  padding:14px 16px;
  min-height:76px;
}
.card .card-actions{
  order:0;
  margin-left:0;
  width:18px;
  flex:0 0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card .drag-handle{
  width:18px;height:32px;padding:0;
  font-size:13px;line-height:1;
  opacity:.42;
  border-radius:6px;
}
.card .drag-handle:hover{opacity:1}
.card .quick-action{display:none}
.card .card-edit{
  margin-left:auto;
  flex:0 0 auto;
  padding:5px 8px;
  font-size:11px;
  opacity:.55;
}
.card:hover .card-edit{opacity:1}
.site-icon{
  width:48px;height:48px;
  flex:0 0 48px;
  border-radius:14px;
}
.site-icon img{width:30px;height:30px}
.card-main{
  min-width:0;
  flex:1 1 auto;
  padding-right:20px;
}
.card .name{font-size:15px;margin-bottom:4px;line-height:1.3}
.card .desc{font-size:11px}
@media(max-width:600px){
  .card{padding:12px 13px;gap:10px}
  .card .card-actions{width:14px;flex-basis:14px}
  .card .drag-handle{width:14px;font-size:11px}
  .site-icon{width:44px;height:44px;flex-basis:44px}
  .site-icon img{width:27px;height:27px}
  .card .name{font-size:14px}
  .card-edit{font-size:10px!important;padding:5px 6px!important}
}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">✦</div><div><h1 id="siteTitle">我的导航</h1><p>Personal Navigation</p></div></div>
  <div class="header-actions">
    <button class="small-btn" onclick="exportData()">↓ <span class="small-label">备份</span></button>
    <button class="small-btn" onclick="document.getElementById('importFile').click()">↑ <span class="small-label">恢复</span></button>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<section class="hero">
  <h2 id="greeting">欢迎回来 👋</h2>
  <p>把常用的网站，都放在这里。</p>
  <div class="time" id="time"></div>
</section>

<div class="search"><span>🔍</span><input id="search" placeholder="搜索网站或直接搜索网页..." autocomplete="off"></div>

<div class="toolbar">
  <div class="categories" id="categoryTabs"></div>
  <button class="primary" onclick="openSiteModal()">＋ 添加网站</button>
</div>

<main id="content"></main>
<footer>数据保存在当前浏览器 · 网站顺序会自动保存 · 建议定期使用「备份」保存导航数据</footer>
</div>

<input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)">

<div class="overlay" id="siteOverlay" onclick="closeOnBg(event,'siteOverlay')">
<div class="modal">
  <h3 id="siteModalTitle">添加网站</h3>
  <div class="form">
    <div class="field"><label>网站名称</label><input id="fName" placeholder="例如：GitHub"></div>
    <div class="field">
  <label>网站地址</label>
  <div style="display:flex;gap:8px">
    <input id="fUrl" placeholder="https://github.com" style="flex:1" onblur="autoRecognizeSite(false)">
    <button type="button" class="small-btn" onclick="autoRecognizeSite(true)">智能识别</button>
  </div>
  <div id="recognizeStatus" style="font-size:11px;color:var(--muted);margin-top:6px">
    输入网址后，可自动识别网站名称、描述和真实图标。
  </div>
</div>
    <div class="field">
  <label>网站图标</label>
  <div style="display:flex;gap:8px">
    <input id="fIcon" placeholder="点击自动获取，也可以手动填写图片 URL 或 Emoji" style="flex:1" oninput="previewSiteIcon(this.value)">
    <button type="button" class="small-btn" onclick="fetchSiteIcon()">自动获取</button>
  </div>
  <div id="siteIconPreview" style="display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--muted)"><span>🔗</span><span>图标预览</span></div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px">
    自动获取网站自己的 favicon；你也可以直接修改为图片 URL 或 Emoji。
  </div>
</div>
    <div class="field"><label>网站描述</label><input id="fDesc" placeholder="代码与开源项目"></div>
    <div class="field"><label>所属分类</label><select id="fCategory"></select></div>
  </div>
  <div class="modal-actions"><button id="siteDeleteBtn" type="button" class="small-btn" style="display:none;margin-right:auto">删除网站</button><button class="small-btn" onclick="closeModal('siteOverlay')">取消</button><button class="primary" onclick="saveSite()">保存</button></div>
</div></div>

<div class="overlay" id="catOverlay" onclick="closeOnBg(event,'catOverlay')">
<div class="modal">
  <h3>管理分类</h3>
  <div class="manage-list" id="manageCats"></div>
  <div class="form" style="margin-top:14px">
  <div class="field"><label>分类名称</label><input id="newCat" placeholder="例如：工作"></div>
  <div class="field">
  <label>分类图标</label>
  <div class="icon-picker-wrap">
    <div class="icon-preview" id="newCatIconPreview">📁</div>
    <input id="newCatIcon" value="📁" placeholder="例如：💼" oninput="setCategoryIcon(this.value)" style="flex:1">
  </div>
  <div class="icon-picker" id="categoryIconPicker"></div>
  <div class="icon-custom-row">
    <input id="customCatIcon" placeholder="也可以输入任意 Emoji，例如：🧠">
    <button type="button" class="small-btn" onclick="useCustomCategoryIcon()">使用</button>
  </div>
</div>
</div>
  <div class="modal-actions"><button class="small-btn" onclick="closeModal('catOverlay')">关闭</button><button class="primary" onclick="addCategory()">＋ 添加分类</button></div>
</div></div>

<script>
const KEY='personal_nav_v2';
const defaultData={
  categories:[
    {id:'study',name:'📚 学习'},
    {id:'ai',name:'🤖 AI 工具'},
    {id:'ent',name:'🎮 娱乐'},
    {id:'common',name:'⭐ 常用网站'}
  ],
  sites:[
    {id:'1',name:'Google',url:'https://www.google.com',icon:'🔎',desc:'搜索引擎',category:'study',fav:true},
    {id:'2',name:'Bing',url:'https://www.bing.com',icon:'🌐',desc:'微软搜索',category:'study'},
    {id:'3',name:'Wikipedia',url:'https://www.wikipedia.org',icon:'📖',desc:'在线百科全书',category:'study'},
    {id:'4',name:'GitHub',url:'https://github.com',icon:'💻',desc:'代码与开源项目',category:'study',fav:true},
    {id:'5',name:'ChatGPT',url:'https://chatgpt.com',icon:'✨',desc:'AI 智能助手',category:'ai',fav:true},
    {id:'6',name:'Claude',url:'https://claude.ai',icon:'🧠',desc:'AI 助手',category:'ai'},
    {id:'7',name:'Gemini',url:'https://gemini.google.com',icon:'💫',desc:'Google AI',category:'ai'},
    {id:'8',name:'DeepSeek',url:'https://www.deepseek.com',icon:'🐋',desc:'AI 对话工具',category:'ai'},
    {id:'9',name:'YouTube',url:'https://www.youtube.com',icon:'▶️',desc:'视频平台',category:'ent'},
    {id:'10',name:'哔哩哔哩',url:'https://www.bilibili.com',icon:'📺',desc:'视频社区',category:'ent'},
    {id:'11',name:'抖音',url:'https://www.douyin.com',icon:'🎵',desc:'短视频平台',category:'ent'},
    {id:'12',name:'网易云音乐',url:'https://music.163.com',icon:'🎧',desc:'音乐平台',category:'ent'},
    {id:'13',name:'Gmail',url:'https://mail.google.com',icon:'📧',desc:'电子邮箱',category:'common'},
    {id:'14',name:'Notion',url:'https://www.notion.so',icon:'📝',desc:'笔记与知识管理',category:'common'},
    {id:'15',name:'Google Drive',url:'https://drive.google.com',icon:'☁️',desc:'云端文件',category:'common'},
    {id:'16',name:'Canva',url:'https://www.canva.com',icon:'🎨',desc:'在线设计',category:'common'}
  ]
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultData);
data.categories=data.categories.map(c=>{
  if(c.icon) return c;
  const m=String(c.name).match(/^(\p{Extended_Pictographic}|\p{Emoji_Presentation})\s*/u);
  return m ? {...c,icon:m[0].trim(),name:String(c.name).slice(m[0].length).trim()} : {...c,icon:'📁'};
});
data.sites=data.sites.map(s=>({...s,iconUrl:isGeneratedFavicon(s.iconUrl)?'':(s.iconUrl||'')}));
let currentCat='all',editingId=null;

function isGeneratedFavicon(url){
  return /^https:\/\/www\.google\.com\/s2\/favicons\?/i.test(url||'');
}

function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function updateTime(){
 const d=new Date(),w=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
 const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const t=d.toLocaleTimeString('zh-CN',{hour12:false});
 document.getElementById('time').textContent=`${date} ${w[d.getDay()]} · ${t}`;
 document.getElementById('greeting').textContent=(d.getHours()<6?'夜深了':d.getHours()<12?'早上好':d.getHours()<18?'下午好':'晚上好')+' 👋';
}
setInterval(updateTime,1000);updateTime();

function renderTabs(){
 const el=document.getElementById('categoryTabs');
 el.innerHTML=`<button class="cat-btn ${currentCat==='all'?'active':''}" onclick="setCat('all')">全部</button>`+
 `<button class="cat-btn ${currentCat==='all'?'active':''}" onclick="setCat('all')">🏠 全部</button>`+
  data.categories.map(c=>`<button class="cat-btn ${currentCat===c.id?'active':''}" draggable="true"
    ondragstart="onCategoryDragStart(event,'${c.id}')" ondragover="onCategoryDragOver(event,'${c.id}')"
    ondragleave="onCategoryDragLeave(event)" ondrop="onCategoryDrop(event,'${c.id}')"
    ondragend="onCategoryDragEnd(event)" onclick="setCat('${c.id}')">${escapeHtml(c.icon||'📁')} ${escapeHtml(c.name)}</button>`).join('')+
 `<button class="cat-btn" onclick="openCatModal()">⚙ 分类</button>`;
}
function setCat(id){currentCat=id;render();}


function getSiteCount(){
  return data.sites.length;
}

function renderTopStats(){
  const el=document.getElementById('topStats');
  if(!el)return;
  const favs=data.sites.filter(s=>s.fav).length;
  const cats=data.categories.length;
  const current=currentCat==='all'?'全部':(data.categories.find(c=>c.id===currentCat)?.name||'全部');
  el.innerHTML=
    `<span class="stat-pill">🌐 ${data.sites.length} 个网站</span>
     <span class="stat-pill">📁 ${cats} 个分类</span>
     <span class="stat-pill">⭐ ${favs} 个收藏</span>
     <span class="stat-pill">📌 当前：${escapeHtml(current)}</span>`;
}

let draggingCategoryId=null;
function onCategoryDragStart(e,id){
  draggingCategoryId=id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain','cat:'+id);
  const element=e.currentTarget;
  setTimeout(()=>element?.classList.add('category-dragging'),0);
}
function onCategoryDragOver(e,targetId){
  if(!draggingCategoryId || draggingCategoryId===targetId)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.cat-btn.drag-over').forEach(x=>x.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onCategoryDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onCategoryDrop(e,targetId){
  e.preventDefault();
  const sourceId=draggingCategoryId;
  if(!sourceId||sourceId===targetId)return onCategoryDragEnd(e);
  const from=data.categories.findIndex(c=>c.id===sourceId);
  const to=data.categories.findIndex(c=>c.id===targetId);
  if(from<0||to<0)return onCategoryDragEnd(e);
  const [moved]=data.categories.splice(from,1);
  data.categories.splice(to,0,moved);
  persist(); render(); onCategoryDragEnd(e);
}
function onCategoryDragEnd(e){
  draggingCategoryId=null;
  document.querySelectorAll('.cat-btn.drag-over,.cat-btn.category-dragging').forEach(x=>x.classList.remove('drag-over','category-dragging'));
}

function deleteSite(id){
  const s=data.sites.find(x=>x.id===id);
  if(!s)return;
  if(!confirm(`确定删除「${s.name}」吗？`))return;
  data.sites=data.sites.filter(x=>x.id!==id);
  persist(); render();
}

function duplicateSite(id){
  const s=data.sites.find(x=>x.id===id);
  if(!s)return;
  const copy={...s,id:crypto.randomUUID(),name:s.name+'（副本）',fav:false};
  const idx=data.sites.findIndex(x=>x.id===id);
  data.sites.splice(idx+1,0,copy);
  persist(); render();
}

function openSiteFromCard(e,url){
  if(e.target.closest('button'))return;
  recordVisit(url);
}

function recordVisit(url){
  try{
    const visits=JSON.parse(localStorage.getItem('personal_nav_visits')||'{}');
    visits[url]=(visits[url]||0)+1;
    localStorage.setItem('personal_nav_visits',JSON.stringify(visits));
  }catch{}
}

function render(){
  renderTopStats();
 renderTabs();
 const q=document.getElementById('search').value.trim().toLowerCase();
 let cats=data.categories.filter(c=>currentCat==='all'||c.id===currentCat);
 let html='';
 cats.forEach(c=>{
   let sites=data.sites.filter(s=>s.category===c.id && (!q || (s.name+' '+s.desc).toLowerCase().includes(q)));
   if(!sites.length && q)return;
   html+=`<section class="section"><div class="section-head"><div class="section-title"><span>${escapeHtml(c.icon||'📁')}</span>${escapeHtml(c.name)}</div></div><div class="links">`;
   sites.forEach(s=>html+=card(s));
   html+='</div></section>';
 });
 if(q && !html){
   const web='https://www.google.com/search?q='+encodeURIComponent(q);
   html=`<div class="empty">没有找到匹配的网站。按 Enter 可直接搜索「${escapeHtml(q)}」<br><br><button class="primary" onclick="window.open('${web}','_blank')">搜索网页</button></div>`;
 }
 if(!html)html='<div class="empty">这里还没有网站，点击右上角「＋ 添加网站」开始添加。</div>';
 document.getElementById('content').innerHTML=html;
}
function card(s){
 return `<a class="card" href="${safeUrl(s.url)}" target="_blank" rel="noopener" data-name="${escapeHtml(s.name)}" data-site-id="${s.id}" data-category="${s.category}" onclick="openSiteFromCard(event,'${safeUrl(s.url)}')" draggable="true" ondragstart="onDragStart(event,'${s.id}')" ondragover="onDragOver(event,'${s.id}')" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${s.id}')" ondragend="onDragEnd(event)">
   <div class="card-actions">
     <button class="drag-handle" title="拖拽排序" onclick="event.preventDefault()" aria-label="拖拽排序">⋮⋮</button>
   </div>
   <div class="site-icon">
     ${s.iconUrl
       ? `<img src="${escapeHtml(s.iconUrl)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">${escapeHtml(s.icon||'🔗')}</span>`
       : escapeHtml(s.icon||'🔗')}
   </div>
   <div class="card-main">
     <div class="name">${escapeHtml(s.name)}</div>
     <div class="desc">${escapeHtml(s.desc||s.url)}</div>
   </div>
   <button class="small-btn card-edit" onclick="event.preventDefault();openSiteModal('${s.id}')" title="编辑网站">编辑</button>
   <button class="fav ${s.fav?'on':''}" title="收藏" onclick="event.preventDefault();toggleFav('${s.id}')">★</button>
 </a>`;
}

let draggingSiteId=null;

function onDragStart(e,id){
  draggingSiteId=id;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',id);
  const element=e.currentTarget;
  setTimeout(()=>element?.classList.add('dragging'),0);
}
function onDragOver(e,targetId){
  if(!draggingSiteId || draggingSiteId===targetId)return;
  const src=data.sites.find(s=>s.id===draggingSiteId);
  const target=data.sites.find(s=>s.id===targetId);
  if(!src||!target)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.card.drag-over').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e,targetId){
  e.preventDefault();
  const sourceId=draggingSiteId||e.dataTransfer.getData('text/plain');
  if(!sourceId || sourceId===targetId)return onDragEnd(e);
  const source=data.sites.find(s=>s.id===sourceId);
  const target=data.sites.find(s=>s.id===targetId);
  if(!source||!target)return onDragEnd(e);

  const sourceIndex=data.sites.findIndex(s=>s.id===sourceId);
  const [moved]=data.sites.splice(sourceIndex,1);
  moved.category=target.category;

  const targetIndex=data.sites.findIndex(s=>s.id===targetId);
  data.sites.splice(targetIndex < 0 ? data.sites.length : targetIndex,0,moved);

  persist();
  draggingSiteId=null;
  render();
}
function onDragEnd(){
  draggingSiteId=null;
  document.querySelectorAll('.card.dragging,.card.drag-over').forEach(el=>{
    el.classList.remove('dragging','drag-over');
  });
}

function openSiteModal(id){
 editingId=id||null;

 document.getElementById('siteModalTitle').textContent=s?'编辑网站':'添加网站';
 fName.value=s?.name||'';fUrl.value=s?.url||'';fIcon.value=s?.iconUrl||'';fDesc.value=s?.desc||'';

function saveSite(){
 const url=fUrl.value.trim(),category=fCategory.value;
 if(!url||!category)return alert('请至少填写网址和分类。');
 let finalUrl=normalizeSiteUrl(url);
 const name=fName.value.trim()||deriveSiteName(finalUrl)||'未命名网站';
 let iconValue=fIcon.value.trim();
 let iconUrl='';
 if(iconValue && /^https?:\/\//i.test(iconValue)){
   iconUrl=iconValue;
 }else{
   iconUrl=getFaviconUrl(finalUrl);
 }
 const obj={name,url:finalUrl,icon:iconUrl?'🔗':(iconValue||'🔗'),iconUrl,desc:fDesc.value.trim()||finalUrl,category};
 if(editingId){const i=data.sites.findIndex(s=>s.id===editingId);data.sites[i]={...data.sites[i],...obj}}
 else data.sites.push({id:crypto.randomUUID(),...obj});
 persist();closeModal('siteOverlay');render();
}


const knownSites = {
  'github.com':'GitHub','google.com':'Google','bing.com':'Bing','wikipedia.org':'Wikipedia',
  'youtube.com':'YouTube','bilibili.com':'哔哩哔哩','douyin.com':'抖音',
  'chatgpt.com':'ChatGPT','openai.com':'OpenAI','claude.ai':'Claude',
  'gemini.google.com':'Gemini','deepseek.com':'DeepSeek','notion.so':'Notion',
  'canva.com':'Canva','figma.com':'Figma','reddit.com':'Reddit','x.com':'X',
  'twitter.com':'X','instagram.com':'Instagram','facebook.com':'Facebook',
  'linkedin.com':'LinkedIn','zhihu.com':'知乎','weibo.com':'微博',
  'taobao.com':'淘宝','jd.com':'京东','amazon.com':'Amazon'
};

function normalizeSiteUrl(value){
  value=(value||'').trim();
  if(!value)return '';
  return /^https?:\/\//i.test(value)?value:'https://'+value;
}

function deriveSiteName(siteUrl){
  try{
    const u=new URL(siteUrl);
    const host=u.hostname.toLowerCase().replace(/^www\./,'');
    if(knownSites[host])return knownSites[host];
    const parts=host.split('.');
    const core=parts.length>1?parts[parts.length-2]:parts[0];
    return core
      .replace(/[-_]+/g,' ')
      .replace(/\b\w/g,m=>m.toUpperCase());
  }catch{return '';}
}

function setRecognizeStatus(text,isError=false){
  const el=document.getElementById('recognizeStatus');
  if(!el)return;
  el.textContent=text;
  el.style.color=isError?'#e05d5d':'var(--muted)';
}

async function autoRecognizeSite(force=true){
  const raw=fUrl.value.trim();
  if(!raw)return;
  const finalUrl=normalizeSiteUrl(raw);
  fUrl.value=finalUrl;

  if(!force && fName.value.trim()) {
    if(!fIcon.value.trim()) fIcon.value=getFaviconUrl(finalUrl);
    return;
  }

  setRecognizeStatus('正在识别网站信息…');
  const fallbackName=deriveSiteName(finalUrl);
  const fallbackIcon=getFaviconUrl(finalUrl);

  if(!fName.value.trim() || force) fName.value=fallbackName||fName.value;
  if(!fIcon.value.trim() || force) fIcon.value=fallbackIcon;

  // Best-effort metadata lookup. If unavailable, domain-based fallback still works.
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),4500);
    const api='https://api.microlink.io/?url='+encodeURIComponent(finalUrl);
    const res=await fetch(api,{signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok)throw new Error('metadata unavailable');
    const json=await res.json();
    const meta=json?.data||{};
    if(meta.title && (!fName.value.trim() || force)) fName.value=meta.title.trim();
    if(meta.description && (!fDesc.value.trim() || force)) fDesc.value=meta.description.trim();
    if(meta.logo?.url) fIcon.value=meta.logo.url;
    else if(meta.image?.url && !fIcon.value.trim()) fIcon.value=meta.image.url;
    else fIcon.value=fallbackIcon;
    setRecognizeStatus('识别完成：已自动填写名称、描述和图标。');
  }catch(err){
    if(!fDesc.value.trim()) {
      try{ fDesc.value=new URL(finalUrl).hostname.replace(/^www\./,''); }catch{}
    }
    fIcon.value=fallbackIcon;
    setRecognizeStatus('已使用本地识别结果；网站名称和图标已自动生成。');
  }
}

function getFaviconUrl(siteUrl){
  try{
    const url=new URL(normalizeSiteUrl(siteUrl));
    return `${url.origin}/favicon.ico`;
  }catch{
    return '';
  }
}

function previewSiteIcon(value){
  const box=document.getElementById('siteIconPreview');
  if(!box)return;
  const text=String(value||'🔗').trim();
  if(/^https?:\/\//i.test(text)){
    box.innerHTML=`<img src="${escapeHtml(text)}" alt="" style="width:24px;height:24px;object-fit:contain" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🔗'}))"><span>图标预览</span>`;
  }else{
    box.innerHTML=`<span style="font-size:22px">${escapeHtml(text||'🔗')}</span><span>图标预览</span>`;
  }
}

function fetchSiteIcon(){
  const url=fUrl.value.trim();
  if(!url)return alert('请先填写网站地址。');
  let finalUrl=/^https?:\/\//i.test(url)?url:'https://'+url;
  const iconUrl=getFaviconUrl(finalUrl);
  fIcon.value=iconUrl;
  previewSiteIcon(iconUrl);
  setRecognizeStatus('已生成网站 favicon 地址，你可以继续修改图标地址后保存。');
}

function toggleFav(id){const s=data.sites.find(x=>x.id===id);if(s)s.fav=!s.fav;persist();render()}
function deleteSite(id){if(confirm('确定删除这个网站吗？')){data.sites=data.sites.filter(s=>s.id!==id);persist();render();}}
function openCatModal(){
 document.getElementById('manageCats').innerHTML=data.categories.map(c=>{
  const count=data.sites.filter(s=>s.category===c.id).length;

  '🌟','🌙','☀️','🌈','🌸','🌱','🍀','🐱','🐶','🦄','🧭','🗺️','⏰','📅','💬','📢'

  const box=document.getElementById('categoryIconPicker');
  if(!box)return;
  box.innerHTML=categoryIcons.map(icon=>`
    <button type="button" class="icon-option ${icon===selected?'selected':''}"
      onclick="setCategoryIcon('${escapeHtml(icon)}')" title="选择 ${escapeHtml(icon)}">${escapeHtml(icon)}</button>
  `).join('');
    setTimeout(()=>renderCategoryIconPicker(document.getElementById('newCatIcon')?.value||'📁'),0);
}

  icon=(icon||'📁').trim();
  if(!icon)return;
  const input=document.getElementById('newCatIcon');
  const preview=document.getElementById('newCatIconPreview');
  if(input)input.value=icon;
  if(preview)preview.textContent=icon;
  renderCategoryIconPicker(icon);
}

  const value=document.getElementById('customCatIcon')?.value.trim();

function addCategory(){
 const name=newCat.value.trim(), icon=newCatIcon.value.trim()||'📁';
 if(!name)return alert('请填写分类名称。');
 data.categories.push({id:crypto.randomUUID(),name,icon});
 newCat.value='';newCatIcon.value='';persist();openCatModal();render();
}
function editCategory(id){
 const c=data.categories.find(x=>x.id===id); if(!c)return;
 const name=prompt('修改分类名称：',c.name);
 if(name===null)return;
 const icon=prompt('修改分类图标（可输入 Emoji，例如 💼）：',c.icon||'📁');
 if(icon===null)return;
 if(!name.trim())return alert('分类名称不能为空。');
 c.name=name.trim();c.icon=icon.trim()||'📁';
 persist();openCatModal();render();
}
function deleteCategory(id){
 const c=data.categories.find(x=>x.id===id);
 if(!c)return;
 if(data.sites.some(s=>s.category===id))return alert('这个分类里还有网站，请先编辑/删除这些网站。');
 if(confirm(`删除分类「${c.name}」？`)){data.categories=data.categories.filter(x=>x.id!==id);if(currentCat===id)currentCat='all';persist();openCatModal();render()}
}

if(localStorage.getItem('dark')==='true'){document.body.classList.add('dark');themeBtn.textContent='☀️'}
function exportData(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='我的个人导航备份.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.categories||!x.sites)throw 0;data=x;persist();render();alert('恢复成功！')}catch{alert('备份文件格式不正确。')}e.target.value=''};r.readAsText(file);
}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function closeOnBg(e,id){if(e.target.id===id)closeModal(id)}
search.addEventListener('input',render);
search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=search.value.trim();if(q&&!data.sites.some(s=>(s.name+' '+s.desc).toLowerCase().includes(q.toLowerCase()))){window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('siteOverlay');closeModal('catOverlay')}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}});
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(x){try{const u=new URL(x);return ['http:','https:'].includes(u.protocol)?escapeHtml(u.href):'#'}catch{return '#'}}
persist();
render();

document.addEventListener('keydown',e=>{
  if(e.ctrlKey && e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('search')?.focus()}
  if(e.ctrlKey && e.key.toLowerCase()==='b'){e.preventDefault();typeof exportData==='function'&&exportData()}
  if(e.ctrlKey && e.key.toLowerCase()==='n'){e.preventDefault();typeof openSiteModal==='function'&&openSiteModal()}
});
