<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>襄阳职业技术大学校园导航站</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --bg: #f4f7fb;
        --card: rgba(255,255,255,0.8);
        --text: #1d2433;
        --subtext: #697586;
        --border: rgba(255,255,255,0.85);
        --accent: #3d6ef7;
        --accent-soft: rgba(61,110,247,0.12);
        --success: #1db88c;
        --shadow: 0 12px 32px rgba(41,57,92,0.08);
    }

    body.dark {
        --bg: #111821;
        --card: rgba(22,29,39,0.8);
        --text: #edf3ff;
        --subtext: #9aa8bf;
        --border: rgba(255,255,255,0.08);
        --accent: #7ea2ff;
        --accent-soft: rgba(126,162,255,0.12);
        --success: #4fd7aa;
        --shadow: 0 12px 32px rgba(0,0,0,0.28);
    }

    body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 12% 15%, rgba(61,110,247,0.18), transparent 24%),
            radial-gradient(circle at 85% 12%, rgba(29,184,140,0.12), transparent 28%),
            var(--bg);
        transition: .3s ease;
    }

    .container {
        width: min(1180px, 92%);
        margin: 0 auto;
        padding: 34px 0 60px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 26px;
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .logo-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        box-shadow: 0 10px 26px rgba(20,92,188,0.18);
        overflow: hidden;
        border: 1px solid rgba(15, 76, 162, 0.08);
    }

    .logo-icon img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
    }

    .logo h1 {
        font-size: 22px;
    }

    .logo p {
        color: var(--subtext);
        font-size: 12px;
        margin-top: 2px;
    }

    .theme-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
        box-shadow: var(--shadow);
    }

    .welcome {
        text-align: center;
        margin: 24px auto 26px;
    }

    .welcome h2 {
        font-size: clamp(28px, 4vw, 42px);
        margin-bottom: 8px;
    }

    .welcome p {
        color: var(--subtext);
        font-size: 15px;
    }

    #time {
        margin-top: 12px;
        font-size: 14px;
        color: var(--accent);
        letter-spacing: 0.04em;
    }

    .search-box {
        position: relative;
        max-width: 720px;
        margin: 0 auto 42px;
    }

    .search-box input {
        width: 100%;
        height: 60px;
        padding: 0 68px 0 58px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 16px;
        box-shadow: var(--shadow);
        outline: none;
        backdrop-filter: blur(16px);
        transition: .25s ease;
    }

    .search-box input:focus {
        border-color: rgba(61,110,247,0.6);
        box-shadow: 0 16px 28px rgba(61,110,247,0.08);
    }

    .search-icon {
        position: absolute;
        left: 20px;
        top: 17px;
        font-size: 22px;
    }

    .search-hint {
        position: absolute;
        right: 16px;
        top: 17px;
        padding: 6px 8px;
        border: 1px solid rgba(128, 128, 128, 0.25);
        border-radius: 8px;
        font-size: 12px;
        color: var(--subtext);
    }

    .category {
        margin-bottom: 34px;
    }

    .category-title {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
        font-size: 18px;
    }

    .category-title span {
        font-size: 22px;
    }

    .links {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
    }

    .link-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        min-height: 82px;
        border-radius: 18px;
        text-decoration: none;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transition: transform .2s ease, border-color .2s ease;
    }

    .link-card:hover {
        transform: translateY(-4px);
        border-color: rgba(61,110,247,0.4);
    }

    .link-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        background: var(--accent-soft);
        font-size: 22px;
    }

    .link-info {
        min-width: 0;
    }

    .link-name {
        margin-bottom: 4px;
        font-size: 15px;
        font-weight: 700;
    }

    .link-desc {
        font-size: 11px;
        color: var(--subtext);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .quick-note {
        margin: 22px 0 30px;
        padding: 16px 18px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(61,110,247,0.08), rgba(29,184,140,0.08));
        border: 1px solid rgba(61,110,247,0.1);
        color: var(--subtext);
        font-size: 14px;
    }

    footer {
        text-align: center;
        margin-top: 40px;
        color: var(--subtext);
        font-size: 12px;
    }

    @media (max-width: 900px) {
        .links {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 560px) {
        .container {
            padding-top: 20px;
        }

        .links {
            grid-template-columns: 1fr;
        }

        .search-hint {
            display: none;
        }
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo">
            <div class="logo-icon" aria-label="襄阳职业技术大学校徽">
                <img src="school-logo.png" alt="襄阳职业技术大学校徽" onerror="this.style.display='none'; this.alt='校徽图片未加载';" />
            </div>
            <div>
                <h1 id="schoolName">襄阳职业技术大学</h1>
                <p>Xiangyang Vocational and Technical University</p>
            </div>
        </div>

        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </header>

    <section class="welcome">
        <h2>校园服务入口</h2>
        <p>一站式访问教务、体测、学习与校园生活服务</p>
        <div id="time"></div>
    </section>

    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="search" type="text" placeholder="搜索课程、教务、体测、图书馆..." autocomplete="off">
        <span class="search-hint">Enter</span>
    </div>

    <div class="quick-note">
        说明：本网站无任何盈利，纯帅气的男大制作，后续将会持续更新以及修复问题，如有意见请留言至---3832249230@qq.com
    </div>

    <div id="navContainer"></div>

    <footer>
        © 2026 校园导航站 · 适用于学生日常学习与办公
    </footer>
</div>

<script>
    const schoolConfig = {
        schoolName: '襄阳职业技术大学',
        schoolDomain: 'https://hbxytc.cn',
        sections: [
            {
                title: '📚 教务与学习',
                links: [
                    { name: '教务系统', desc: '学生信息与课程管理', url: 'https://jwxt.hbxytc.cn/jwapp/sys/homeapp/home/index.html?av=&contextPath=/jwapp#/', icon: '📘' },
                    { name: '选课系统', desc: '选课与培养计划', url: 'https://xk.hbxytc.cn/xsxk/profile/index.html', icon: '📋' },
                    { name: '智慧职教', desc: '职业教育平台', url: 'https://www.icve.com.cn/index', icon: '🎓' },
                    { name: '学习通', desc: '在线学习与作业', url: 'https://passport2.chaoxing.com/login?fid=12&refer=http%3A%2F%2Fi.chaoxing.com%2Fbase%3Fnull&space=2', icon: '🧠' },
                    { name: 'iTEST智能测评云平台', desc: '智能测评与考试', url: 'https://itestcloud.unipus.cn/', icon: '🧪' },
                    { name: '中国大学MOOC', desc: '大学公开课平台', url: 'https://www.icourse163.org/', icon: '📖' }
                ]
            },
            {
                title: '🏃 体测与体育',
                links: [
                    { name: '体测', desc: '体测数据与检测结果', url: 'http://hbxytc.ticeyun.com:70/wxlogin?method=logout', icon: '🏃' },
                    { name: '体育选课', desc: '体育课程与课表', url: 'https://xk.hbxytc.cn/xsxk/profile/index.html', icon: '⚽' }
                ]
            },
            {
                title: '🧩 校园服务',
                links: [
                    { name: '学校官网', desc: '学校简介与通知公告', url: 'https://www.hbxytc.cn/', icon: '🏛️' },
                    { name: '图书馆', desc: '馆藏与借阅服务', url: 'https://tsg.hbxytc.cn/', icon: '📚' },
                    { name: '网上办事大厅', desc: '报名、申请与流程', url: 'https://xgxt.hbxytc.cn/xsfw/sys/emapfunauth/pages/funauth-login.do?service=https://xgxt.hbxytc.cn/xsfw/sys/xggzptapp/index.do#/', icon: '🧾' },
                    { name: '校园邮箱', desc: '学生邮箱与通知', url: 'https://mail.example.edu.cn', icon: '📧' }
                ]
            },
            {
                title: '🧭 常用工具',
                links: [
                    { name: '学工系统', desc: '学生事务与状态查询', url: 'https://xgxt.hbxytc.cn/xsfw/sys/emapfunauth/pages/funauth-login.do?service=https://xgxt.hbxytc.cn/xsfw/sys/xggzptapp/index.do#/', icon: '🧑‍🎓' },
                    { name: '校园一卡通', desc: '消费与证件服务', url: 'https://card.example.edu.cn', icon: '💳' },
                    { name: '学习资料', desc: '课程资料与资源库', url: 'https://res.example.edu.cn', icon: '🗂️' },
                    { name: '校园地图', desc: '教学楼与宿舍导航', url: 'https://map.example.edu.cn', icon: '🧭' }
                ]
            }
        ]
    };

    document.getElementById('schoolName').textContent = schoolConfig.schoolName;

    const navContainer = document.getElementById('navContainer');

    function renderNav() {
        navContainer.innerHTML = schoolConfig.sections.map(section => `
            <section class="category">
                <div class="category-title"><span>${section.title.split(' ')[0]}</span><b>${section.title.replace(/^\S+\s/, '')}</b></div>
                <div class="links">
                    ${section.links.map(link => `
                        <a class="link-card" href="${link.url}" target="_blank" rel="noopener noreferrer">
                            <div class="link-icon">${link.icon}</div>
                            <div class="link-info">
                                <div class="link-name">${link.name}</div>
                                <div class="link-desc">${link.desc}</div>
                            </div>
                        </a>
                    `).join('')}
                </div>
            </section>
        `).join('');
    }

    renderNav();

    function updateTime() {
        const now = new Date();
        const week = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('time').textContent = `${year}-${month}-${day} ${week[now.getDay()]} · ${h}:${m}:${s}`;
    }

    updateTime();
    setInterval(updateTime, 1000);

    function toggleTheme() {
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('darkMode', isDark);
    }

    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️';
    }

    document.getElementById('search').addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            const keyword = this.value.trim();
            if (!keyword) return;
            const url = 'https://www.google.com/search?q=' + encodeURIComponent(keyword);
            window.open(url, '_blank');
        }
    });
</script>
</body>
</html>
